spring:
  application:
    name: mexc-merkle-hacken-data
  
  datasource:
    url: mysql://localhost:3306/your_database_name?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: your_database_username
    password: your_database_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mexc.merkle.data.entity
  configuration:
    map-underscore-to-camel-case: true
    # Remove SQL logging to reduce log output
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.mexc.merkle.data: INFO
    com.mexc.merkle.data.mapper.com.mexc.merkle.data.mapper.FinMerkleTreeLeafDataMapper: WARN
    # Reduce SQL logging
    org.apache.ibatis: WARN
    com.zaxxer.hikari: WARN
    org.springframework.jdbc: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Export configuration
export:
  # Batch processing size
  batch-size: 1000
  # Export file directory
  output-dir: ./exports
  # CSV file name prefix
  file-prefix: mexc_merkle_data
  # Maximum rows per file (2 million)
  max-rows-per-file: 2000000
